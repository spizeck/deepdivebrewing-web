name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check React versions
        # react/react-dom must declare the same version; Dependabot grouping
        # does not enforce this, so CI does.
        run: npm run check:react-versions

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Set up Java (Firebase emulators require JDK 21+)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Security rules tests (Firestore/Storage emulators)
        run: npm run test:rules

      - name: Build
        # Service clients initialize lazily, so `next build` needs no
        # credentials or config placeholders. Firestore reads made during
        # prerendering resolve empty (offline) when no project config is
        # present, which is the intended CI behavior.
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        # Runs against the production build from the previous step — the
        # Playwright webServer starts `next start`, never rebuilds.
        run: npx playwright test

      - name: Upload smoke-test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check Markdown links
        run: npm run check:md-links
