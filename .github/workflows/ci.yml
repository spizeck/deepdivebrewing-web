name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Non-secret placeholders: `next build` evaluates modules that
          # construct Firebase and Resend clients at page-data collection
          # time, so these values must be present but are never used to
          # reach real services. No credentials are required for CI.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-dummy-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:cidummy
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-CIDUMMY123
          RESEND_API_KEY: re_ci_dummy_key

      - name: Check Markdown links
        run: npm run check:md-links
