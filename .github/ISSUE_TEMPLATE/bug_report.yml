name: Bug report
description: Something is broken or behaving incorrectly
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Affected page or route
      placeholder: "e.g. /beers, /beers/neipa, /admin, /api/trade-inquiry"
  - type: input
    id: environment
    attributes:
      label: Browser / environment
      description: When relevant — e.g. Safari on iOS, Chrome on Windows, production vs preview deployment.
      placeholder: "e.g. Chrome on Windows 11, production site"
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Console errors, screenshots, or network details that help explain the problem.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant.
